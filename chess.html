<!DOCTYPE html>
<html>
<head>
    <title>Chess Board</title>
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #fff;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            border: 8px solid #000;
        }

        .square {
            width: 60px;
            height: 60px;
            display: grid;
            place-items: center;
        }

        .light {
            background: #fff;
        }

        .dark {
            background: #000;
        }
    </style>
</head>
<body>
    <div class="board" id="board"></div>

    <script>
        const board = document.getElementById("board");

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement("div");
                square.className = `square ${(r + c) % 2 ? "dark" : "light"}`;
                board.appendChild(square);
            }
        }
    </script>
</body>
</html>
