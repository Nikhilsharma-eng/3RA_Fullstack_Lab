
<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial;
}

body {
    background: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.calculator {
    background: #aaa;
    padding: 20px;
    border-radius: 20px;
    width: 350px;
}

.display {
    background: white;
    padding: 20px;
    height: 100px;
    text-align: right;
    font-size: 30px;
    margin-bottom: 15px;
    border-radius: 10px;
    overflow: hidden;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 65px;
    border-radius: 50%;
    border: 1px solid #777;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #b8b0ff;
    transform: scale(1.1);
    box-shadow: 0 5px 10px #666;
}

.clear {
    background: pink;
    grid-column: span 2;
    border-radius: 10px;
}

.delete {
    background: #aaa4ff;
    grid-column: span 2;
    border-radius: 10px;
}

.buttons .clear,
.buttons .delete {
    height: 55px;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="display" id="display">0</div>

    <div class="buttons">

        <button class="clear" onclick="clearAll()">CLEAR</button>
        <button class="delete" onclick="deleteLast()">DELETE</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('/')">÷</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('*')">×</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="add('-')">−</button>

        <button onclick="add('.')">.</button>
        <button onclick="add('0')">0</button>
        <button onclick="calculate()">=</button>
        <button onclick="add('+')">+</button>

    </div>
</div>

<script>
let display = document.getElementById("display");

function add(value) {
    if (display.innerText === "Error") display.innerText = "0";

    if (display.innerText === "0" && value !== ".") {
        display.innerText = value;
    } else {
        display.innerText += value;
    }
}

function calculate() {
    try {
        let result = Function('"use strict"; return (' + display.innerText + ')')();
        display.innerText = Number.isFinite(result) ?
            String(Number(result.toPrecision(12))) : "Error";
    } catch {
        display.innerText = "Error";
    }
}

function clearAll() {
    display.innerText = "0";
}

function deleteLast() {
    display.innerText = display.innerText.slice(0, -1) || "0";
}
</script>

</body>
</html>
