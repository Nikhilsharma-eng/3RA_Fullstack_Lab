
<!DOCTYPE html>
<html>
<head>
    <title>Age Eligibility Checker</title>
</head>
<body>
    <h2>Age Eligibility Checker</h2>

    <script>
        // Take input from the user
        let age = prompt("Enter your age:");

        // Convert input into a number
        age = Number(age);

        // Check eligibility using if-else
        if (age >= 18) {
            alert("You are eligible.");
            document.write("Your age is: " + age + "<br>");
            document.write("You are eligible.");
        } else {
            alert("You are not eligible.");
            document.write("Your age is: " + age + "<br>");
            document.write("You are not eligible.");
        }

        // Check eligibility using the ternary operator
        let result = age >= 18
            ? "Eligible"
            : "Not Eligible";

        document.write("<br><br>Result using ternary operator: " + result);
    </script>
</body>
</html>
